[protocal]
publish_ip=tcp://*:{port}
subscribe_ip=tcp://*:{port}

[calibration]
steer_angle_offset=0.0
camera_pitch_angle_offset=0.0
camera_yaw_angle_offset=0.0

[camera]
width=960
height=720
buffer_length=120
frame_rate=30
is_record=true

[battery]
; 배터리 전압 앵커 (LCD에 표시되는 전압값 기준, 분압비 x3). 만충/저전압 때 LCD에 찍힌 값으로 교체하세요.
; high_voltage = 100% 기준(만충), low_voltage = 0%/저전압 LED 경고 기준
high_voltage=8.4
low_voltage=6.5

[logging]
; 디버그 로그(spdlog). 총 보관량 = (rotated_files + 1) x file_size_kb. 기본 (1+1)x1024KB = 2MB.
file_path=logs/autodrive.log
file_size_kb=1024
rotated_files=1

[security]
; 외부 TCP 통신 CURVE 암호화. 켜려면 zmq_curve_keypair로 키페어 생성해 install/AutoDrive.ini에 넣고
; 클라이언트는 curve_server_public_key로 CURVE 접속(평문 클라이언트는 차단). secret_key는 로컬 보관(커밋 금지).
enable_curve=false
curve_server_public_key=
curve_server_secret_key=
